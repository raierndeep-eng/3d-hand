<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mobile 3D Hand Tracker</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#camera{position:fixed;right:12px;bottom:82px;width:115px;height:155px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.25);transform:scaleX(-1);z-index:10;background:#111}
#topBar{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 14px 14px;z-index:20;pointer-events:none}
#title{display:inline-block;padding:9px 13px;border-radius:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);color:white;font-size:14px;font-weight:bold}
#status{display:block;margin-top:7px;color:#00ffd5;font-size:12px}
#buttons{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:30}
button{border:0;color:white;background:rgba(20,20,25,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);padding:12px 16px;border-radius:14px;font-size:13px;font-weight:bold;box-shadow:0 5px 20px rgba(0,0,0,.3)}
button:active{transform:scale(.94)}
#loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#020304;color:white;text-align:center;padding:30px}
#loadingText{font-size:17px;font-weight:bold}#loadingSmall{color:#888;font-size:13px}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#00ffd5;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="loadingText">Loading hand tracker...</div><div id="loadingSmall">Camera + 3D engine starting</div></div>
<div id="topBar"><div id="title">🖐️ 3D HAND TRACKER</div><div id="status">Starting...</div></div>
<video id="camera" autoplay muted playsinline></video>
<div id="buttons"><button id="cameraButton">🔄 Camera</button><button id="resetButton">🎯 Reset</button><button id="hideCameraButton">👁 Hide Camera</button></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video=document.getElementById("camera"),status=document.getElementById("status"),loading=document.getElementById("loading"),loadingText=document.getElementById("loadingText");
const cameraButton=document.getElementById("cameraButton"),resetButton=document.getElementById("resetButton"),hideCameraButton=document.getElementById("hideCameraButton");

const scene=new THREE.Scene();scene.background=new THREE.Color(0x020304);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(0,0,3.3);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(2,3,4);scene.add(light);

const hand=new THREE.Group();scene.add(hand);
const jointGeometry=new THREE.SphereGeometry(.045,12,12);
const jointMaterial=new THREE.MeshStandardMaterial({color:0x00ffd5,emissive:0x003b32,metalness:.65,roughness:.25});
const joints=[];
for(let i=0;i<21;i++){const j=new THREE.Mesh(jointGeometry,jointMaterial);hand.add(j);joints.push(j)}

const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
const boneGeometry=new THREE.CylinderGeometry(.022,.022,1,8);
const boneMaterial=new THREE.MeshStandardMaterial({color:0x00ffff,emissive:0x002b2b,metalness:.7,roughness:.2});
const bones=[];for(let i=0;i<connections.length;i++){const b=new THREE.Mesh(boneGeometry,boneMaterial);hand.add(b);bones.push(b)}

const direction=new THREE.Vector3(),midpoint=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
function updateBone(bone,start,end){
 direction.subVectors(end,start);const length=direction.length();midpoint.addVectors(start,end).multiplyScalar(.5);
 bone.position.copy(midpoint);bone.scale.set(1,length,1);bone.quaternion.setFromUnitVectors(up,direction.normalize());
}

let handLandmarker=null,stream=null,currentFacingMode="user";
async function createTracker(){
 const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
 handLandmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{
  modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:"GPU"
 },runningMode:"VIDEO",numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.55,minTrackingConfidence:.55});
}
async function startCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 status.textContent="Starting camera...";
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacingMode,width:{ideal:720},height:{ideal:540},frameRate:{ideal:30,max:30}},audio:false});
 video.srcObject=stream;await video.play();
 video.style.transform=currentFacingMode==="user"?"scaleX(-1)":"scaleX(1)";
 status.textContent="Show your hand 🖐️";
}

let lastVideoTime=-1,lastDetection=0;
const detectionInterval=1000/30;
function detectHands(timestamp){
 if(!handLandmarker||video.readyState<2){requestAnimationFrame(detectHands);return}
 if(video.currentTime!==lastVideoTime&&timestamp-lastDetection>=detectionInterval){
  lastDetection=timestamp;lastVideoTime=video.currentTime;
  const result=handLandmarker.detectForVideo(video,timestamp);
  if(result.landmarks&&result.landmarks.length){updateHand(result.landmarks[0]);status.textContent="Hand detected ✓"}
  else status.textContent="Show your hand 🖐️";
 }
 requestAnimationFrame(detectHands);
}

const targets=Array.from({length:21},()=>new THREE.Vector3());
function updateHand(landmarks){
 for(let i=0;i<21;i++){
  const p=landmarks[i];targets[i].set((p.x-.5)*2.4,-(p.y-.5)*2.4,-p.z*2.2);
  joints[i].position.lerp(targets[i],.55);
 }
 for(let i=0;i<connections.length;i++){const[a,b]=connections[i];updateBone(bones[i],joints[a].position,joints[b].position)}
}

let touching=false,lastX=0,lastY=0,rotationVelocityX=0,rotationVelocityY=0;
renderer.domElement.addEventListener("touchstart",e=>{touching=true;const t=e.touches[0];lastX=t.clientX;lastY=t.clientY},{passive:true});
renderer.domElement.addEventListener("touchmove",e=>{
 if(!touching)return;const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;
 hand.rotation.y+=dx*.008;hand.rotation.x+=dy*.008;rotationVelocityY=dx*.0005;rotationVelocityX=dy*.0005;lastX=t.clientX;lastY=t.clientY;
},{passive:true});
renderer.domElement.addEventListener("touchend",()=>touching=false);

cameraButton.addEventListener("click",async()=>{currentFacingMode=currentFacingMode==="user"?"environment":"user";try{await startCamera()}catch(e){console.error(e);status.textContent="Could not switch camera"}});
resetButton.addEventListener("click",()=>{hand.rotation.set(0,0,0);camera.position.set(0,0,3.3)});
let cameraVisible=true;
hideCameraButton.addEventListener("click",()=>{cameraVisible=!cameraVisible;video.style.display=cameraVisible?"block":"none";hideCameraButton.textContent=cameraVisible?"👁 Hide Camera":"👁 Show Camera"});

let lastTap=0;
renderer.domElement.addEventListener("touchend",()=>{const now=Date.now();if(now-lastTap<300)hand.rotation.set(0,0,0);lastTap=now});

function render(){
 requestAnimationFrame(render);
 if(!touching){hand.rotation.y+=rotationVelocityY;hand.rotation.x+=rotationVelocityX;rotationVelocityY*=.94;rotationVelocityX*=.94}
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

async function start(){
 try{
  loadingText.textContent="Loading hand tracking...";await createTracker();
  loadingText.textContent="Starting camera...";await startCamera();
  loading.style.display="none";requestAnimationFrame(detectHands);render();
 }catch(error){
  console.error(error);loadingText.textContent="Something went wrong";document.getElementById("loadingSmall").textContent="Make sure you opened this on HTTPS and allowed camera access.";
 }
}
start();
</script>
</body>
</html>
